<style>
:root{
  --terracota:#9A4215; --carbon:#424949; --texto:#2B2B2B; --gris:#5E5E5E;
  --arena:#EFE7DE; --arena-suave:#F7F2EC; --crema:#E8DCD0; --pizarra:#788991;
  --ok:#4F7A5A; --alerta:#B5651D; --terracota-suave:#FBF0E8; --verde-suave:#E9F2EB; --verde-texto:#2E5A3A;
  --radio:16px; --sombra:0 1px 2px rgba(66,73,73,.08),0 6px 24px rgba(66,73,73,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--arena);color:var(--texto);font-family:Jost,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3{font-family:Poppins,Helvetica,Arial,sans-serif;font-weight:600;color:var(--carbon);letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;font-size:17px}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding:16px 16px 4px;max-width:560px;margin:0 auto}
.top img{height:40px;width:40px}
.top b{font-family:Poppins;font-weight:600;font-size:16px;color:var(--carbon)}
main{padding:8px 16px 40px;max-width:560px;margin:0 auto}
.vista{display:flex;flex-direction:column;gap:16px;animation:entra .2s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
h1{font-size:26px;line-height:1.2;margin-top:8px}
h2{font-size:18px;line-height:1.3}
p,.sub{font-size:17px;line-height:1.45;color:var(--gris)}
.caja{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);padding:18px}
.caja h2{margin-bottom:6px}
.dato{display:flex;justify-content:space-between;gap:12px;font-size:16px;padding:6px 0;border-top:1px solid var(--arena)}
.dato:first-of-type{border-top:0}
.dato span:first-child{color:var(--gris)}
.aviso{background:var(--terracota-suave);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.4;color:var(--texto)}
.aviso.ok{background:var(--verde-suave);color:var(--verde-texto)}
label{font-size:15px;color:var(--gris);display:block;margin-bottom:6px}
.campo{width:100%;border:1.5px solid var(--crema);background:#fff;border-radius:12px;padding:14px 16px;outline:0;font-size:18px}
.campo:focus{border-color:var(--pizarra)}
textarea.campo{min-height:88px;resize:vertical}
.btn{display:block;width:100%;border-radius:14px;padding:16px 18px;font-size:18px;font-weight:500;text-align:center;min-height:56px}
.btn.pri{background:var(--terracota);color:#fff}
.btn.sec{background:#fff;color:var(--carbon);border:1.5px solid var(--crema)}
.btn:active{filter:brightness(.94)}
.atras{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 0;margin:-10px 0 2px;font-size:16px;font-weight:500;color:var(--carbon);opacity:.8}
.atras:active{opacity:1}
.btn[disabled]{opacity:.55}
.op{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--crema);border-radius:var(--radio);padding:16px;min-height:56px}
.op b{display:block;font-family:Poppins;font-weight:600;font-size:17px;color:var(--carbon)}
.op span{display:block;font-size:15px;color:var(--gris);margin-top:2px}
.op:active,.op[aria-pressed="true"]{border-color:var(--terracota);background:var(--terracota-suave)}
.error{color:var(--alerta);font-size:16px;min-height:20px}
.preg{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.preg h3{font-size:17px}
.preg h3 small{font-family:Jost;font-weight:400;color:var(--gris);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--crema);background:#fff;border-radius:999px;padding:10px 14px;font-size:16px;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--terracota);background:var(--terracota);color:#fff}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.nps .chip{padding:10px 0;border-radius:10px;text-align:center}
.nps-leyenda{display:flex;justify-content:space-between;font-size:13px;color:var(--gris)}
.folio{font-family:Poppins;font-weight:600;font-size:32px;color:var(--terracota);letter-spacing:.04em;text-align:center}
.priv{font-size:13px;color:var(--gris);line-height:1.4}
.par{display:flex;flex-direction:column;gap:10px}
/* Recap (Olmo 23-nov): historias a pantalla completa, tipo «Wrapped» */
.cargando{display:flex;flex-direction:column;align-items:center;gap:14px;padding:64px 0;text-align:center}
.cargando i{width:44px;height:44px;border-radius:50%;border:3px solid var(--crema);border-top-color:var(--terracota);animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.rc{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y;
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 16px);transition:background .5s ease}
.rc.t0{background:linear-gradient(160deg,#9A4215 0%,#6E2F10 100%)}
.rc.t1{background:linear-gradient(160deg,#424949 0%,#2B3030 100%)}
.rc.t2{background:linear-gradient(160deg,#788991 0%,#4F5E65 100%)}
.rc.t3{background:linear-gradient(160deg,#B5651D 0%,#9A4215 100%)}
.rc.t4{background:linear-gradient(160deg,#4F7A5A 0%,#2E5A3A 100%)}
.rc.t5{background:linear-gradient(160deg,#EFE7DE 0%,#E8DCD0 100%);color:var(--texto)}
.rc-barras{display:flex;gap:4px;max-width:560px;width:100%;margin:0 auto}
.rc-barras span{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.rc.t5 .rc-barras span{background:rgba(66,73,73,.2)}
.rc-barras b{display:block;height:100%;width:0;background:currentColor}
.rc-barras b.lleno{width:100%}
.rc-barras b.corre{animation:llena var(--dur,7s) linear forwards}
.rc.quieto .rc-barras b.corre{animation-play-state:paused}
@keyframes llena{from{width:0}to{width:100%}}
.rc-top{display:flex;justify-content:space-between;align-items:center;max-width:560px;width:100%;margin:10px auto 0;font-size:15px;opacity:.9}
.rc-top button{padding:10px 4px 10px 16px;font-size:16px;font-weight:500;min-height:44px}
.rc-cuerpo{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:560px;width:100%;margin:0 auto;padding:8px 4px}
.rc-cuerpo>*{animation:sube .6s cubic-bezier(.2,.8,.2,1) both}
.rc-cuerpo>*:nth-child(2){animation-delay:.12s}.rc-cuerpo>*:nth-child(3){animation-delay:.24s}.rc-cuerpo>*:nth-child(4){animation-delay:.36s}.rc-cuerpo>*:nth-child(5){animation-delay:.48s}
@keyframes sube{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rc-cuerpo .ante{font-family:Jost;font-size:18px;letter-spacing:.02em;opacity:.85}
.rc-cuerpo h2{font-family:Poppins;font-weight:600;font-size:34px;line-height:1.12;color:inherit;letter-spacing:-.02em}
.rc-cuerpo .grande{font-family:Poppins;font-weight:600;font-size:88px;line-height:1;letter-spacing:-.04em}
.rc-cuerpo p{font-size:19px;line-height:1.45;color:inherit;opacity:.92}
.rc-lista{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.rc-lista div{display:flex;align-items:center;gap:12px;font-size:18px}
.rc-lista em{font-style:normal;font-family:Poppins;font-weight:600;font-size:22px;min-width:28px}
.rc-lista i{flex:1;height:10px;border-radius:10px;background:rgba(255,255,255,.22);overflow:hidden}
.rc-lista i s{display:block;height:100%;background:#fff;border-radius:10px;transform-origin:left;animation:barra .9s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes barra{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rc-estrellas{display:flex;flex-wrap:wrap;gap:8px;font-size:30px}
.rc-ins{display:flex;flex-wrap:wrap;gap:10px}
.rc-ins span{background:rgba(255,255,255,.16);border-radius:999px;padding:10px 16px;font-size:17px}
.rc-nota{background:rgba(255,255,255,.14);border-radius:14px;padding:14px 16px;font-size:17px;line-height:1.45}
.rc.t5 .rc-nota{background:#fff;color:var(--texto)}
.rc-fin{display:flex;flex-direction:column;gap:10px;max-width:560px;width:100%;margin:0 auto}
.rc-fin .btn.sec{background:transparent;border-color:rgba(66,73,73,.3)}
.rc-toque{position:absolute;top:90px;bottom:120px;width:40%;z-index:0}
.rc-toque.izq{left:0}.rc-toque.der{right:0;width:60%}
.rc-cuerpo,.rc-top,.rc-fin{position:relative;z-index:1}
.rc-cuerpo{pointer-events:none}
.rc-cuerpo a{pointer-events:auto}
@media (prefers-reduced-motion:reduce){.rc{transition:none}.rc-barras b.corre{animation:none;width:100%}}
</style>

<body>
<div class="top"><img src="https://static.wixstatic.com/media/9d6afa_e930e021d3564d24bc04bdc3e4c172f3~mv2.png/v1/fill/w_140,h_140/icono.png" alt=""><b>Hera Zenter</b></div>
<main id="app" aria-live="polite"></main>
<script>
/* Baja con encuesta (docs/BAJA.md): correo + 4 dígitos → su plan → opciones para quedarse → encuesta → folio.
   Sin cookies ni almacenamiento: el pase de 30 min vive solo en esta pestaña. Todo se pinta con esc(). */
const LOCAL = /\.localhost$/.test(location.hostname);
const DEV = new URLSearchParams(location.search).has('dev');
const API_URL = LOCAL ? '/_functions/checkinApi' : `https://www.herazenter.com/${DEV ? '_functions-dev' : '_functions'}/checkinApi`;
const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fecha = v => { if (!v) return '—'; const d = new Date(v.length === 10 ? v + 'T18:00:00Z' : v); return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'long', timeZone: 'America/Mexico_City' }); };
const ymdLocal = d => d.toLocaleDateString('en-CA', { timeZone: 'America/Mexico_City' });
const MOTIVOS = [['precio', 'Precio'], ['horarios', 'Los horarios no me quedan'], ['salud', 'Lesión o salud'], ['mudanza', 'Me mudo o viajo'], ['tiempo', 'Falta de tiempo o trabajo'],
  ['resultados', 'No vi resultados'], ['coach_clase', 'La coach o la clase'], ['cupo', 'Cupo lleno, no alcanzo lugar'], ['otro_estudio', 'Me voy a otro estudio'], ['pausa', 'Solo quiero pausar'], ['otro', 'Otro']];
const QUEDARSE = [['horario', 'Otro horario'], ['plan_barato', 'Un plan más barato o con menos clases'], ['pausa', 'Poder pausar'], ['lugares', 'Más lugares'], ['disciplina', 'Otra disciplina o coach'], ['nada', 'Nada, es por mí'], ['otro', 'Otro']];
const ERRORES = { verificacion: 'El correo o los 4 dígitos no coinciden con un plan. Revisa que sea el correo con el que compraste; si no tienes celular registrado, escríbele a recepción por WhatsApp.', agotado: 'Ya hubo varios intentos hoy. Escríbele a recepción por WhatsApp y te ayudamos.',
  espera: 'Espera unos segundos y vuelve a intentar.', demasiadas: 'Demasiados intentos. Espera unos minutos.', ocupado: 'Estamos con mucha demanda. Intenta en unos minutos.',
  pase: 'Pasaron más de 30 minutos. Vuelve a empezar, por favor.', 'pausa-reciente': 'Ya usaste la pausa que trae tu plan, así que esta vez no se puede pausar.',
  'en-proceso': 'Ya estamos procesando esto. Espera un momento.', 'ya-cancelada': 'Este plan ya tiene su cancelación en proceso.', regreso: 'Esa fecha de regreso no entra en la pausa de tu plan.',
  orden: 'Ese plan ya no está activo. Vuelve a empezar, por favor.', 'no-cancelable': 'Este plan no se puede cancelar desde aquí. Escríbele a recepción por WhatsApp.',
  'sin-plan-chico': 'Ya no hay un plan más chico disponible. Escríbele a recepción por WhatsApp.', 'no-activa': 'Tu plan no está activo, así que no se puede pausar.',
  'no-recurrente': 'Este plan no se renueva solo, así que no hace falta pausarlo.', 'ya-cancelada-pausa': 'Este plan ya tiene su cancelación en proceso.',
  opcion: 'Elige una opción.', encuesta: 'Falta contestar algunas preguntas.', wix: 'No pudimos conectar. Intenta de nuevo en un momento.', red: 'Sin conexión. Revisa tu internet e intenta de nuevo.' };
const S = { pase: null, nombre: '', ordenes: [], o: null, encuesta: { motivosExtra: [] }, vioOpciones: false, hc: null };

async function api(accion, datos) {
  let r;
  try { r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, cache: 'no-store', credentials: 'omit', body: JSON.stringify({ accion, ...datos }) }); }
  catch (_) { return { ok: false, error: 'red' }; }
  let b = {}; try { b = await r.json(); } catch (_) {}
  if (!r.ok && b.error === 'pase') { S.pase = null; }
  return b && typeof b === 'object' ? b : { ok: false, error: 'wix' };
}
const msj = b => (b.error === 'verificacion' && b.segundos > 3 ? ERRORES.verificacion + ` Espera ${b.segundos} segundos antes de volver a intentar.` : ERRORES[b.error] || ERRORES.wix);
// Botón «Atrás» en cada pantalla después de entrar (Olmo, 23-nov): una pila de pantallas. En las finales (ya se hizo algo)
// el botón es «Inicio» y vuelve a pedir correo y 4 dígitos (así ve su plan ya actualizado).
let pila = [], actual = null, volviendo = false;
function paso(f, ...args) { if (actual && !volviendo && actual.f !== f) pila.push(actual); volviendo = false; actual = { f, args }; }
function atras() { const p = pila.pop(); if (!p) return reiniciar(); volviendo = true; actual = null; p.f(...p.args); }
function reiniciar() { pila = []; actual = null; S.pase = null; inicio(); }
function pinta(html, alPintar, final = false) {
  const nav = !actual || actual.f === inicio ? '' : final ? '<button class="atras" id="atras">← Inicio</button>' : '<button class="atras" id="atras">← Atrás</button>';
  $app.innerHTML = `<section class="vista">${nav}${html}</section>`; window.scrollTo(0, 0);
  const b = document.getElementById('atras'); if (b) b.addEventListener('click', final ? reiniciar : atras);
  if (alPintar) alPintar();
}
const on = (id, fn) => { const e = document.getElementById(id); if (e) e.addEventListener('click', fn); };
async function ocupado(btn, fn) { btn.disabled = true; try { await fn(); } finally { if (document.body.contains(btn)) btn.disabled = false; } }

// ---------------------------------------------------------------- 1. correo + 4 dígitos
function inicio(error = '') {
  pila = []; actual = { f: inicio, args: [] };
  pinta(`<h1>Tu plan en Hera</h1>
    <p>Aquí puedes pausar, cambiar o cancelar tu plan. Escribe el correo con el que lo compraste y los 4 últimos dígitos de tu celular.</p>
    <div><label for="email">Correo</label><input id="email" class="campo" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false"></div>
    <div><label for="ult4">4 últimos dígitos de tu celular</label><input id="ult4" class="campo" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"></div>
    <div class="error" id="err">${esc(error)}</div>
    <button class="btn pri" id="seguir">Continuar</button>`, () => {
    on('seguir', e => ocupado(e.currentTarget, async () => {
      const email = document.getElementById('email').value.trim(), ult4 = document.getElementById('ult4').value.replace(/\D/g, '');
      if (!/^\S+@\S+\.\S+$/.test(email)) return void (document.getElementById('err').textContent = 'Escribe tu correo completo.');
      if (ult4.length !== 4) return void (document.getElementById('err').textContent = 'Escribe los 4 últimos dígitos de tu celular.');
      const b = await api('bajaEntrar', { email, ult4 });
      if (!b.ok) return void (document.getElementById('err').textContent = msj(b));
      Object.assign(S, { pase: b.pase, nombre: b.nombre || '', ordenes: b.ordenes || [], hc: b.heraConmigo && b.heraConmigo.texto ? b.heraConmigo : null });
      recap();
    }));
  });
}

// ---------------------------------------------------------------- 1b. recap (Olmo 23-nov: «tipo Spotify Wrapped, nostálgico»)
// Nunca bloquea: si tarda más de 13 s o no hay historial, se sigue directo a su plan. «Saltar» siempre visible.
const QUIETO = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MES_LARGO = ym => { const [y, m] = String(ym).split('-'); return `${MESES[+m - 1]} de ${y}`; };
const ELEMENTO = { AGUA: '💧 Agua', FUEGO: '🔥 Fuego', TIERRA: '🌿 Tierra', AIRE: '🌬️ Aire' };
const n1 = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
// «Ana L., Sofía M. y Caro R.» (+ «y N más» si hay más frecuentes que nombres).
const listaNombres = (ns, total) => { const mas = total - ns.length; const xs = mas > 0 ? [...ns, `${mas} más`] : ns; return xs.length > 1 ? `${xs.slice(0, -1).join(', ')} y ${xs[xs.length - 1]}` : xs[0]; };
// Hera Conmigo (Olmo 23-nov): solo un AVISO, nunca detiene la baja. El backend decide si sale y con qué texto.
const avisoHc = (claro = false) => (S.hc ? `<div class="${claro ? 'aviso' : 'rc-nota'}">🏠 ${esc(S.hc.texto)}${S.hc.url ? ` <a href="${esc(S.hc.url)}" target="_blank" rel="noopener" style="color:inherit;font-weight:600">Conócelo</a>` : ''}</div>` : '');
async function recap() {
  pinta(`<div class="cargando"><i></i><h2>Hola, ${esc(S.nombre)}</h2><p>Estamos juntando tu historia en Hera…</p></div>`);
  const b = await Promise.race([api('bajaRecap', { pase: S.pase }), new Promise(r => setTimeout(() => r({}), 13000))]);
  const tarjetas = b && b.ok && b.recap ? tarjetasRecap(b.recap) : [];
  if (tarjetas.length < 3) return elegir();
  historias(tarjetas);
}
function tarjetasRecap(R) {
  const T = [];
  const hace = R.primera.meses >= 24 ? `Hace ${Math.floor(R.primera.meses / 12)} años` : R.primera.meses >= 2 ? `Hace ${R.primera.meses} meses` : R.primera.meses === 1 ? 'Hace un mes' : 'Hace muy poquito';
  T.push({ t: 0, h: `<div class="ante">Tu historia en Hera</div><h2>${esc(S.nombre)}, antes de decidir, mira todo lo que has hecho.</h2>` });
  T.push({ t: 1, h: `<div class="ante">${esc(hace)}…</div><h2>Todo empezó el ${esc(fecha(R.primera.fecha))}</h2><p>Tu primera clase fue de ${esc(R.primera.titulo)}. ¿Te acuerdas cómo te sentiste al salir?</p>` });
  T.push({ t: 3, h: `<div class="ante">Desde entonces llevas</div><div class="grande">${R.total}</div><h2>${R.total === 1 ? 'clase' : 'clases'}</h2>${R.horas ? `<p>Eso es ${n1(R.horas, 'hora', 'horas')} solo para ti, respirando, sudando y haciéndote más fuerte.</p>` : ''}` });
  if (R.disciplinas && R.disciplinas.length) {
    const max = R.disciplinas[0].n;
    T.push({ t: 2, h: `<div class="ante">Tu lugar favorito</div><h2>${esc(R.disciplinas[0].d)}</h2>
      <div class="rc-lista">${R.disciplinas.map(d => `<div><span style="min-width:96px">${esc(d.d)}</span><i><s style="width:${Math.max(8, Math.round(d.n / max * 100))}%"></s></i><em>${d.n}</em></div>`).join('')}</div>
      ${R.nDisciplinas > 1 ? `<p>Probaste ${R.nDisciplinas} disciplinas distintas.</p>` : ''}` });
  }
  if (R.coach) T.push({ t: 4, h: `<div class="ante">La voz que más escuchaste</div><h2>${esc(R.coach.nombre)}</h2><p>Compartieron ${R.coach.veces} clases. Te ha visto crecer clase con clase.</p>` });
  if (R.horario) T.push({ t: 1, h: `<div class="ante">Tu momento de la semana</div><h2>Los ${esc(R.horario.dia)} a las ${esc(R.horario.hora)}</h2><p>Ahí estuviste ${R.horario.veces} veces. Ese ratito ya era tuyo.</p>` });
  if (R.mejorMes) T.push({ t: 3, h: `<div class="ante">Tu mejor mes</div><h2>${esc(MES_LARGO(R.mejorMes.mes))}</h2><div class="grande">${R.mejorMes.n}</div><p>clases en un solo mes. ¡Qué mes!</p>` });
  if (R.racha && R.racha.mejor >= 2) T.push({ t: 4, h: `<div class="ante">Tu mejor racha</div><div class="grande">${R.racha.mejor}</div><h2>semanas seguidas</h2>${R.racha.actual >= 2 ? `<p>Y ahorita llevas ${R.racha.actual} semanas sin fallar.</p>` : '<p>La constancia también se extraña.</p>'}` });
  if (R.estrellas && (R.estrellas.ganadas.length || R.estrellas.siguiente)) {
    const g = R.estrellas.ganadas;
    T.push({ t: 0, h: `<div class="ante">Tus estrellas</div>${g.length ? `<div class="rc-estrellas">${g.map(() => '⭐').join('')}</div><h2>${g.length === 1 ? 'Ya ganaste la estrella de' : 'Ya ganaste las de'} ${g.length > 1 ? g.slice(0, -1).join(', ') + ' y ' + g[g.length - 1] : g[0]} clases</h2>` : '<h2>Tu primera estrella está cerca</h2>'}
      ${R.estrellas.siguiente ? `<p>Te ${R.estrellas.faltan === 1 ? 'falta 1 clase' : `faltan ${R.estrellas.faltan} clases`} para la de ${R.estrellas.siguiente}.</p>` : ''}` });
  }
  const ins = (R.insignias || []).map(i => i.k === 'elemento' ? ELEMENTO[i.v] : i.k === 'miembro' ? '🌿 Miembro Hera' : i.k === 'estrella' ? `⭐ ${i.v} clases` : i.k === 'aniversario' ? `🎂 ${n1(i.v, 'año', 'años')} con nosotras` : null).filter(Boolean);
  if (ins.length >= 2) T.push({ t: 2, h: `<div class="ante">Lo que te has ganado</div><h2>Tus insignias</h2><div class="rc-ins">${ins.map(x => `<span>${esc(x)}</span>`).join('')}</div>` });
  if (R.compas) T.push({ t: 1, h: `<div class="ante">Tu comunidad (últimos 6 meses)</div><div class="grande">${R.compas.total}</div><h2>${R.compas.total === 1 ? 'compañera' : 'compañeras'} de clase</h2>${(R.compas.nombres || []).length ? `<p>${esc(listaNombres(R.compas.nombres, R.compas.frecuentes))} te ven seguido: coincidiste con ellas 4 veces o más. Ya eres parte de su rutina, y ellas de la tuya.</p>` : R.compas.frecuentes ? `<p>Con ${n1(R.compas.frecuentes, 'de ellas', 'de ellas')} coincidiste 4 veces o más. Ya eres parte de su rutina, y ellas de la tuya.</p>` : '<p>Cada una de ellas te vio llegar.</p>'}` });
  const P = R.plan;
  if (P && (R.perdida || P.restantes != null)) {
    T.push({ t: 5, h: `<div class="ante">Lo que te queda</div><h2>${esc(P.nombre)}</h2>
      ${P.restantes != null ? `<div class="grande" style="color:var(--terracota)">${P.restantes}</div><p>${P.restantes === 1 ? 'clase por usar' : 'clases por usar'}${P.hasta ? ` hasta el ${esc(fecha(P.hasta))}` : ''}${P.reservadas ? ` (${n1(P.reservadas, 'ya reservada', 'ya reservadas')})` : ''}.</p>` : ''}
      ${R.perdida ? `<div class="rc-nota">${esc(R.perdida)}</div>` : ''}${P.descuento ? '<p>Con tu membresía también tienes 10% de descuento en talleres y eventos.</p>' : ''}` });
  }
  T.push({ t: 5, fin: true, h: `<div class="ante">${esc(S.nombre)},</div><h2>¿Seguimos juntas?</h2><p>Lo que construiste aquí es tuyo. Si algo no te está funcionando, cuéntanos: casi siempre hay una forma.</p>${avisoHc()}` });
  return T;
}
function historias(T) {
  let i = 0, timer = null, x0 = null;
  const DUR = 7000;
  document.body.insertAdjacentHTML('beforeend', `<div class="rc t0" id="rc" role="dialog" aria-label="Tu historia en Hera">
    <div class="rc-barras">${T.map(() => '<span><b></b></span>').join('')}</div>
    <div class="rc-top"><span>Hera Zenter</span><button id="rc-saltar">Saltar</button></div>
    <button class="rc-toque izq" aria-label="Anterior"></button><button class="rc-toque der" aria-label="Siguiente"></button>
    <div class="rc-cuerpo" aria-live="polite"></div><div class="rc-fin"></div></div>`);
  const $rc = document.getElementById('rc'), $c = $rc.querySelector('.rc-cuerpo'), $f = $rc.querySelector('.rc-fin'), barras = [...$rc.querySelectorAll('.rc-barras b')];
  const cerrar = sig => { clearTimeout(timer); document.removeEventListener('keydown', tecla); $rc.remove(); sig(); };
  const ir = n => {
    if (n < 0) n = 0;
    if (n >= T.length) return;
    i = n; clearTimeout(timer);
    const t = T[i];
    $rc.className = `rc t${t.t}`;
    barras.forEach((b, k) => { b.className = k < i ? 'lleno' : ''; b.style.removeProperty('--dur'); });
    void barras[i].offsetWidth;
    barras[i].className = t.fin ? 'lleno' : 'corre';
    $c.innerHTML = t.h;
    $f.innerHTML = t.fin ? `<button class="btn pri" id="rc-quedo">Sí, me quedo 💛</button><button class="btn sec" id="rc-cambio">Ver mis opciones</button>` : '';
    if (t.fin) {
      document.getElementById('rc-quedo').addEventListener('click', () => cerrar(() => pinta(`<h1>¡Qué gusto, ${esc(S.nombre)}!</h1><p>Tu plan sigue igual, no tienes que hacer nada más. Nos vemos en tu próxima clase.</p>`, null, true)));
      document.getElementById('rc-cambio').addEventListener('click', () => cerrar(elegir));
    } else if (!QUIETO) timer = setTimeout(() => ir(i + 1), DUR);
  };
  const pausa = v => { $rc.classList.toggle('quieto', v); if (v) clearTimeout(timer); else if (!QUIETO && !T[i].fin) { clearTimeout(timer); timer = setTimeout(() => ir(i + 1), DUR / 2); } };
  const tecla = e => { if (e.key === 'ArrowRight') ir(i + 1); else if (e.key === 'ArrowLeft') ir(i - 1); else if (e.key === 'Escape') cerrar(elegir); };
  document.addEventListener('keydown', tecla);
  document.getElementById('rc-saltar').addEventListener('click', () => cerrar(elegir));
  $rc.querySelector('.rc-toque.izq').addEventListener('click', () => ir(i - 1));
  $rc.querySelector('.rc-toque.der').addEventListener('click', () => ir(i + 1));
  $rc.addEventListener('pointerdown', e => { x0 = e.clientX; if (e.target.closest('.rc-toque')) pausa(true); });
  $rc.addEventListener('pointerup', e => { pausa(false); if (x0 != null && Math.abs(e.clientX - x0) > 60) { e.preventDefault(); ir(i + (e.clientX < x0 ? 1 : -1)); } x0 = null; });
  $rc.addEventListener('pointercancel', () => { pausa(false); x0 = null; });
  ir(0);
}

// ---------------------------------------------------------------- 2. su plan
function elegir() {
  const vivas = S.ordenes.filter(o => o.recurrente);
  if (!vivas.length && !S.ordenes.length) { paso(elegir); return pinta(`<h1>Hola, ${esc(S.nombre)}</h1><p>No encontramos un plan activo con tu cuenta, así que no hay nada que cancelar. Si crees que es un error, escríbele a recepción por WhatsApp.</p>`); }
  if (!vivas.length) return soloPaquete();
  if (vivas.length === 1) { S.o = vivas[0]; return plan(); }
  paso(elegir);
  pinta(`<h1>Hola, ${esc(S.nombre)}</h1><p>Tienes más de un plan. ¿Cuál quieres revisar?</p>
    ${vivas.map((o, i) => `<button class="op" data-i="${i}"><b>${esc(o.nombre)}</b><span>${o.cobra ? 'Se renueva el ' + esc(fecha(o.cobra)) : esc(estadoTxt(o))}</span></button>`).join('')}`,
    () => $app.querySelectorAll('.op').forEach(b => b.addEventListener('click', () => { S.o = vivas[+b.dataset.i]; plan(); })));
}
const estadoTxt = o => (o.estado === 'PAUSED' ? 'En pausa' : o.yaCancelada ? 'Cancelación en proceso' : 'Activa');
function plan() {
  const o = S.o; paso(plan);
  if (o.folio || o.yaCancelada) return pinta(`<h1>${esc(o.nombre)}</h1><div class="aviso ok">${o.folio ? `Ya pediste tu cancelación. Tu folio es <b>${esc(o.folio)}</b>.` : 'Este plan ya está cancelado y no se volverá a cobrar.'} Conservas tus clases hasta el ${esc(fecha(o.fin))}.</div>
    <p>¿Dudas? Escríbele a recepción por WhatsApp.</p>`);
  pinta(`<h1>Hola, ${esc(S.nombre)}</h1>
    <div class="caja"><h2>${esc(o.nombre)}</h2>
      <div class="dato"><span>Estado</span><span>${esc(estadoTxt(o))}</span></div>
      ${o.cobra ? `<div class="dato"><span>Próximo cobro</span><span>${esc(fecha(o.cobra))}</span></div>` : ''}
      <div class="dato"><span>Tus clases siguen hasta</span><span>${esc(fecha(o.fin))}</span></div>
    </div>
    ${o.cargo500 ? '<div class="aviso">Llevas menos de 2 pagos de tu membresía. Según los términos de tu plan, cancelar antes de 2 ciclos de pago tiene un cargo de <b>$500</b>.</div>' : ''}
    <button class="btn pri" id="seguir">Quiero hacer un cambio</button>`, () => on('seguir', opciones));
}
function soloPaquete() {
  paso(soloPaquete);
  pinta(`<h1>Hola, ${esc(S.nombre)}</h1>
    <div class="aviso ok">Tu plan es un paquete: no se renueva solo, así que no hay nada que cancelar. Tus clases siguen hasta que se terminen o venzan.</div>
    <p>¿Nos ayudas a mejorar contestando 5 preguntas? Toma 2 minutos.</p>
    <button class="btn pri" id="si">Contestar</button><button class="btn sec" id="no">No, gracias</button>`,
    () => { on('si', () => { S.o = null; encuesta(); }); on('no', () => pinta('<h1>Gracias</h1><p>Aquí te esperamos.</p>', null, true)); });
}

// ---------------------------------------------------------------- 3. opciones para quedarse (una sola vez, el «no» del mismo tamaño)
function opciones() {
  paso(opciones);
  const o = S.o; S.vioOpciones = true;
  const ops = [];
  if (o.pausable && o.pausa) ops.push(['pausa', o.pausa.min === o.pausa.max ? `Pausar ${o.pausa.texto}` : `Pausar hasta ${o.pausa.texto}`, 'Para imprevistos. No se te cobra mientras está en pausa y regresas con tus mismas condiciones.']);
  if (o.planChico) ops.push(['plan_chico', 'Un plan más chico', `${o.planChico.nombre}: $${Number(o.planChico.precio).toLocaleString('es-MX')} por periodo, en lugar de tu plan actual.`]);
  ops.push(['horario', 'Otro horario o disciplina', 'Recepción te escribe hoy con opciones que te queden.']);
  pinta(`<h1>Antes de irte, ¿te sirve alguna de estas?</h1>
    ${ops.map(([k, t, d]) => `<button class="op" data-k="${k}"><b>${esc(t)}</b><span>${esc(d)}</span></button>`).join('')}
    ${avisoHc(true)}
    <button class="op" id="no"><b>No, gracias, quiero cancelar</b><span>Antes te hacemos 7 preguntas rápidas.</span></button>`, () => {
    $app.querySelectorAll('.op[data-k]').forEach(b => b.addEventListener('click', () => (b.dataset.k === 'pausa' ? pausa() : quedarse(b.dataset.k))));
    on('no', encuesta);
  });
}
function pausa(error = '') {
  paso(pausa);
  // BAJ12-A: el tope viene del backend según el plan (mensual 1 semana fija; trimestral 1 semana; semestral 2; anual 1 mes).
  const P = S.o.pausa, fija = P.desde === P.hasta;
  const cada = P.porCiclo ? 'una vez en cada periodo de tu plan' : 'una vez al año';
  pinta(`<h1>Pausar mi plan</h1>${fija
    ? `<p>Tu plan trae una pausa de ${esc(P.texto)} para imprevistos (${cada}). Regresas el <b>${esc(fecha(P.desde))}</b> y ese día tu plan se reactiva solo.</p>
    <input id="regreso" type="hidden" value="${esc(P.desde)}">`
    : `<p>Tu plan trae hasta ${esc(P.texto)} de pausa para imprevistos (${cada}). Elige el día en que regresas; ese día tu plan se reactiva solo.</p>
    <div><label for="regreso">Regreso el</label><input id="regreso" class="campo" type="date" min="${esc(P.desde)}" max="${esc(P.hasta)}" value="${esc(P.hasta)}"></div>`}
    <div class="error" id="err">${esc(error)}</div>
    <button class="btn pri" id="ok">Pausar</button><button class="btn sec" id="volver">Volver</button>`, () => {
    on('volver', atras);
    on('ok', e => ocupado(e.currentTarget, async () => {
      const b = await api('bajaPausar', { pase: S.pase, orderId: S.o.id, regreso: document.getElementById('regreso').value });
      if (!b.ok) return b.error === 'pase' ? inicio(ERRORES.pase) : void (document.getElementById('err').textContent = msj(b));
      pinta(`<h1>Listo, tu plan ${b.automatica ? 'quedó' : 'queda'} en pausa</h1>
        <div class="caja"><div class="dato"><span>Regresas el</span><span>${esc(fecha(b.regreso))}</span></div>
        ${b.cobro ? `<div class="dato"><span>Tu cobro se retoma aprox. el</span><span>${esc(fecha(b.cobro))}</span></div>` : ''}
        <div class="dato"><span>Folio</span><span>${esc(b.folio)}</span></div></div>
        <p>${b.automatica ? 'No se te cobra mientras está en pausa.' : 'Recepción la aplica hoy y te confirma por WhatsApp.'}</p>`, null, true);
    }));
  });
}
function quedarse(opcion) {
  paso(quedarse, opcion);
  const o = S.o, t = opcion === 'plan_chico' ? `Cambiar a ${o.planChico.nombre}` : 'Otro horario o disciplina';
  pinta(`<h1>${esc(t)}</h1><p>${opcion === 'plan_chico' ? `Tu plan actual sigue hasta el ${esc(fecha(o.fin))}; desde ahí pagas $${Number(o.planChico.precio).toLocaleString('es-MX')} por periodo. Recepción te escribe hoy para hacer el cambio.` : 'Recepción te escribe hoy con horarios y disciplinas que te queden.'}</p>
    <div class="error" id="err"></div><button class="btn pri" id="ok">Sí, quiero esto</button><button class="btn sec" id="volver">Volver</button>`, () => {
    on('volver', atras);
    on('ok', e => ocupado(e.currentTarget, async () => {
      const b = await api('bajaQuedarse', { pase: S.pase, orderId: o.id, opcion });
      if (!b.ok) return b.error === 'pase' ? inicio(ERRORES.pase) : void (document.getElementById('err').textContent = msj(b));
      pinta(`<h1>¡Qué gusto que te quedes!</h1><p>Recepción te escribe hoy por WhatsApp.${b.folio ? ` Tu folio es <b>${esc(b.folio)}</b>.` : ''}</p>`, null, true);
    }));
  });
}

// ---------------------------------------------------------------- 4. encuesta (5 obligatorias de un toque, BAJ4-A)
function chips(id, lista, multi = false) {
  return `<div class="chips" id="${id}" role="group">${lista.map(([k, t]) => `<button class="chip" data-k="${esc(k)}" aria-pressed="false">${esc(t)}</button>`).join('')}</div>`;
}
function encuesta() {
  paso(encuesta);
  const E = S.encuesta;
  pinta(`<h1>${S.o ? 'Antes de cancelar, ayúdanos a mejorar' : 'Ayúdanos a mejorar'}</h1>
    <p class="priv">Tus respuestas solo las usa Hera para mejorar. Si el motivo es de salud, no te pedimos detalles. Aviso de privacidad en herazenter.com.</p>
    <div class="preg"><h3>1. ¿Cuál es el motivo principal?</h3>${chips('motivo', MOTIVOS)}</div>
    <div class="preg" id="b-extra"><h3>2. ¿Algo más? <small>(opcional, varias)</small></h3>${chips('motivosExtra', MOTIVOS, true)}</div>
    <div class="preg" id="b-detalle"><h3>3. Cuéntanos más <small>(opcional, sin datos personales)</small></h3><textarea id="detalle" class="campo" maxlength="200"></textarea></div>
    <div class="preg"><h3>4. ¿Qué te habría hecho quedarte?</h3>${chips('quedarse', QUEDARSE)}</div>
    <div class="preg"><h3>5. Del 0 al 10, ¿qué tanto nos recomendarías?</h3><div class="nps chips" id="nps">${Array.from({ length: 11 }, (_, i) => `<button class="chip" data-k="${i}" aria-pressed="false">${i}</button>`).join('')}</div>
      <div class="nps-leyenda"><span>Nada</span><span>Muchísimo</span></div></div>
    <div class="preg"><h3>6. ¿Te gustaría regresar algún día?</h3>${chips('regreso', [['si', 'Sí'], ['tal_vez', 'Tal vez'], ['no', 'No']])}
      <div id="b-mes" hidden><label for="mes">¿Más o menos cuándo? (opcional)</label><input id="mes" class="campo" type="month" min="${ymdLocal(new Date()).slice(0, 7)}"></div></div>
    <div class="preg"><h3>7. ¿Te podemos escribir?</h3>${chips('contacto', [['whatsapp', 'Sí, por WhatsApp'], ['correo', 'Sí, por correo'], ['no', 'No']])}</div>
    <div class="error" id="err"></div>
    <button class="btn pri" id="seguir">${S.o ? 'Seguir' : 'Enviar'}</button>`, () => {
    $app.querySelectorAll('.chips').forEach(g => g.addEventListener('click', ev => {
      const b = ev.target.closest('.chip'); if (!b) return;
      const id = g.id, k = id === 'nps' ? +b.dataset.k : b.dataset.k;
      if (id === 'motivosExtra') { const i = E.motivosExtra.indexOf(k); i < 0 ? E.motivosExtra.push(k) : E.motivosExtra.splice(i, 1); b.setAttribute('aria-pressed', String(i < 0)); return; }
      E[id] = k; g.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
      if (id === 'motivo') document.getElementById('b-detalle').hidden = k === 'salud';
      if (id === 'regreso') document.getElementById('b-mes').hidden = k === 'no';
    }));
    on('seguir', e => {
      E.detalle = document.getElementById('detalle').value; E.regresoMes = document.getElementById('mes').value || null;
      const falta = ['motivo', 'quedarse', 'nps', 'regreso', 'contacto'].filter(k => E[k] == null);
      if (falta.length) return void (document.getElementById('err').textContent = 'Falta contestar las preguntas 1, 4, 5, 6 y 7 (un toque cada una).');
      if (!S.o) return ocupado(e.currentTarget, () => enviar(null));
      confirmar();
    });
  });
}

// ---------------------------------------------------------------- 5. confirmar y folio
function confirmar() {
  paso(confirmar);
  const o = S.o;
  pinta(`<h1>Confirmar cancelación</h1>
    <div class="caja"><h2>${esc(o.nombre)}</h2>
      <div class="dato"><span>Se cancela al final de tu periodo pagado</span><span>${esc(fecha(o.fin))}</span></div>
      <div class="dato"><span>Ya no se te cobra después de esa fecha</span><span>✓</span></div>
      <div class="dato"><span>Cargo por cancelar antes de 2 ciclos</span><span>${o.cargo500 ? '$500' : 'No aplica'}</span></div></div>
    <p>Conservas tus clases hasta el ${esc(fecha(o.fin))}. Si regresas, te abonamos tus clases sin usar.</p>
    ${['tiempo', 'mudanza'].includes(S.encuesta.motivo) ? avisoHc(true) : ''}
    <div class="error" id="err"></div>
    <div class="par"><button class="btn pri" id="ok">Confirmar cancelación</button><button class="btn sec" id="volver">Volver</button></div>`, () => {
    on('volver', atras);
    on('ok', e => ocupado(e.currentTarget, () => enviar(o.id)));
  });
}
async function enviar(orderId) {
  const b = await api('bajaConfirmar', { pase: S.pase, orderId, encuesta: S.encuesta, vioOpciones: S.vioOpciones });
  if (!b.ok) { if (b.error === 'pase') return inicio(ERRORES.pase); const e = document.getElementById('err'); if (e) e.textContent = msj(b); return; }
  if (!orderId) return pinta('<h1>¡Gracias!</h1><p>Tus respuestas nos ayudan mucho. Aquí te esperamos.</p>', null, true);
  pinta(`<h1>Recibimos tu cancelación</h1><div class="caja"><p style="text-align:center">Tu folio</p><div class="folio">${esc(b.folio)}</div></div>
    <p>${b.cancelada ? 'Tu plan ya quedó cancelado: no se te volverá a cobrar.' : 'Recepción la procesa hoy y te confirma por WhatsApp.'} Conservas tus clases hasta el ${esc(fecha(b.fin || S.o.fin))}.</p>
    <p>Gracias por el tiempo que entrenaste con nosotras.</p>`, null, true);
}

inicio();
